spec:
  inputs:
    stage:
      default: deploy
    image:
      default: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
    docka-url:
      description: Docka API origin
    app-id:
      description: Immutable Docka app UUID
    environment:
      default: production
    token-variable:
      default: DOCKA_TOKEN
      description: Name of an expiring app-scoped fallback token variable
    wait:
      type: boolean
      default: true
    timeout-seconds:
      type: number
      default: 240
---
docka-deploy:
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  id_tokens:
    DOCKA_ID_TOKEN:
      aud: https://api.docka.dev/ci
  environment:
    name: $[[ inputs.environment ]]
    action: start
  variables:
    DOCKA_URL: $[[ inputs.docka-url ]]
    DOCKA_APP_ID: $[[ inputs.app-id ]]
    DOCKA_ENVIRONMENT: $[[ inputs.environment ]]
    DOCKA_TOKEN_VARIABLE: $[[ inputs.token-variable ]]
    DOCKA_WAIT: $[[ inputs.wait ]]
    DOCKA_TIMEOUT_SECONDS: $[[ inputs.timeout-seconds ]]
  script:
    - |
      python - <<'PY'
      import hashlib
      import json
      import os
      import re
      import sys
      import time
      import urllib.error
      import urllib.parse
      import urllib.request

      MAX_RESPONSE = 1024 * 1024
      AUDIENCE = "https://api.docka.dev/ci"

      def origin(raw):
          parsed = urllib.parse.urlsplit(raw.strip())
          local = parsed.hostname in {"localhost", "127.0.0.1", "::1"}
          if (parsed.scheme != "https" and not (parsed.scheme == "http" and local)) or parsed.username or parsed.password or parsed.query or parsed.fragment or parsed.path not in {"", "/"}:
              raise ValueError("docka-url must be a public HTTPS origin or a local HTTP origin")
          return f"{parsed.scheme}://{parsed.netloc}"

      class NoRedirect(urllib.request.HTTPRedirectHandler):
          def redirect_request(self, request, file_pointer, code, message, headers, new_url):
              raise RuntimeError("Docka response attempted a redirect")

      opener = urllib.request.build_opener(NoRedirect)

      def request_json(url, method="GET", token="", payload=None, idempotency_key="", retries=0):
          body = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
          headers = {"Accept": "application/json"}
          if body is not None:
              headers["Content-Type"] = "application/json"
          if token:
              headers["Authorization"] = f"Bearer {token}"
          if idempotency_key:
              headers["Idempotency-Key"] = idempotency_key
          for attempt in range(retries + 1):
              try:
                  with opener.open(urllib.request.Request(url, data=body, headers=headers, method=method), timeout=30) as response:
                      raw = response.read(MAX_RESPONSE + 1)
                      if len(raw) > MAX_RESPONSE:
                          raise RuntimeError("Docka response exceeded 1 MiB")
                      return json.loads(raw or b"{}")
              except urllib.error.HTTPError as error:
                  raw = error.read(MAX_RESPONSE + 1)
                  try:
                      details = json.loads(raw or b"{}")
                  except json.JSONDecodeError:
                      details = {}
                  if attempt < retries and (error.code == 429 or error.code >= 500):
                      time.sleep(attempt + 1)
                      continue
                  message = details.get("message") or details.get("error") or f"Docka request failed with HTTP {error.code}"
                  if isinstance(message, dict):
                      message = message.get("message", f"Docka request failed with HTTP {error.code}")
                  raise RuntimeError(re.sub(r"dk_[A-Za-z0-9._~-]+", "[REDACTED]", str(message))[:500]) from None

      base = origin(os.environ["DOCKA_URL"])
      app_id = os.environ["DOCKA_APP_ID"].strip()
      environment = os.environ["DOCKA_ENVIRONMENT"].strip()
      timeout = int(os.environ["DOCKA_TIMEOUT_SECONDS"])
      wait = os.environ["DOCKA_WAIT"].lower() == "true"
      if not re.fullmatch(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}", app_id):
          raise ValueError("app-id must be a UUID")
      if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,127}", environment):
          raise ValueError("environment is invalid")
      if timeout < 10 or timeout > 240:
          raise ValueError("timeout-seconds must be between 10 and 240")

      token = os.environ.get(os.environ["DOCKA_TOKEN_VARIABLE"], "").strip()
      if not token:
          assertion = os.environ.get("DOCKA_ID_TOKEN", "").strip()
          if not assertion:
              raise RuntimeError("GitLab OIDC token is unavailable and no fallback token was provided")
          exchange = request_json(f"{base}/api/v1/ci/exchange", "POST", payload={
              "provider": "gitlab", "id_token": assertion, "app_id": app_id, "environment": environment,
          })
          token = exchange.get("access_token", "")
      if not token:
          raise RuntimeError("Docka did not issue an access token")

      commit = os.environ.get("CI_COMMIT_SHA", "").strip()
      if commit and not re.fullmatch(r"[0-9a-fA-F]{7,64}", commit):
          raise ValueError("CI_COMMIT_SHA is invalid")
      key_material = ":".join(("gitlab", os.environ.get("CI_PROJECT_ID", ""), os.environ.get("CI_PIPELINE_ID", ""), app_id, environment, commit))
      idempotency_key = "gitlab-" + hashlib.sha256(key_material.encode()).hexdigest()
      deploy = request_json(
          f"{base}/api/v1/apps/{urllib.parse.quote(app_id, safe='')}/deploy",
          "POST", token, {"commit_sha": commit, "commit_author": os.environ.get("GITLAB_USER_LOGIN", "gitlab-ci")}, idempotency_key, 2,
      )
      deployment_id = deploy.get("deployment_id", "")
      if not re.fullmatch(r"[0-9a-fA-F-]{36}", deployment_id):
          raise RuntimeError("Docka returned an invalid deployment ID")
      deployment_url = f"{base}/app/apps/{app_id}?deployment={deployment_id}"
      status = "queued"
      if wait:
          deadline = time.monotonic() + timeout
          while time.monotonic() < deadline:
              deployments = request_json(f"{base}/api/v1/apps/{urllib.parse.quote(app_id, safe='')}/deployments?page=1&page_size=50", token=token)
              match = next((item for item in deployments.get("items", []) if item.get("id") == deployment_id), {})
              status = str(match.get("status", "")).lower()
              if status in {"running", "success", "succeeded", "completed"}:
                  break
              if status in {"failed", "error", "cancelled", "canceled"}:
                  raise RuntimeError(f"Docka deployment ended with status {status}")
              time.sleep(5)
          else:
              raise RuntimeError(f"Docka deployment did not finish within {timeout} seconds")

      with open("docka.env", "w", encoding="utf-8") as output:
          output.write(f"DOCKA_DEPLOYMENT_ID={deployment_id}\nDOCKA_DEPLOYMENT_STATUS={status}\nDOCKA_DEPLOYMENT_URL={deployment_url}\n")
      print(f"Docka deployment {deployment_id} status: {status}")
      PY
  artifacts:
    reports:
      dotenv: docka.env
